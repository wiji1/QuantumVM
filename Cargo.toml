[package]
name = "QuantumVM"
version = "0.1.0"
edition = "2024"

[lib]
name = "quantum_vm"
path = "src/lib.rs"

[[bin]]
name = "QuantumVM"
path = "src/main.rs"

[[bin]]
name = "qasm-lsp"
path = "src/bin/lsp_server.rs"

[dependencies]
regex = "1.11.1"
num-complex = "0.4"
rand = "0.10.1"
rayon = "1.10"
serde_json = "1.0"
ariadne = { version = "0.4", features = ["auto-color"] }

tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
dashmap = "6.0"
env_logger = "0.11"
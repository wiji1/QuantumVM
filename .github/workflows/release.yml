name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  repository-projects: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name_vm: QuantumVM
            artifact_name_lsp: qasm-lsp
            asset_name_vm: QuantumVM-linux-x86_64
            asset_name_lsp: qasm-lsp-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name_vm: QuantumVM
            artifact_name_lsp: qasm-lsp
            asset_name_vm: QuantumVM-linux-aarch64
            asset_name_lsp: qasm-lsp-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name_vm: QuantumVM
            artifact_name_lsp: qasm-lsp
            asset_name_vm: QuantumVM-macos-x86_64
            asset_name_lsp: qasm-lsp-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name_vm: QuantumVM
            artifact_name_lsp: qasm-lsp
            asset_name_vm: QuantumVM-macos-aarch64
            asset_name_lsp: qasm-lsp-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name_vm: QuantumVM.exe
            artifact_name_lsp: qasm-lsp.exe
            asset_name_vm: QuantumVM-windows-x86_64.exe
            asset_name_lsp: qasm-lsp-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build QuantumVM (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --bin QuantumVM --target ${{ matrix.target }}

      - name: Build qasm-lsp (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --bin qasm-lsp --target ${{ matrix.target }}

      - name: Build QuantumVM (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --bin QuantumVM --target ${{ matrix.target }}

      - name: Build qasm-lsp (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --bin qasm-lsp --target ${{ matrix.target }}

      - name: Rename binaries
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name_vm }} ${{ matrix.asset_name_vm }}
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name_lsp }} ${{ matrix.asset_name_lsp }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name_vm }}
            ${{ matrix.asset_name_lsp }}
